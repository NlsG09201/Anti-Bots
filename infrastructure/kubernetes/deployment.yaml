apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamshield-api
  labels:
    app: streamshield-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: streamshield-api
  template:
    metadata:
      labels:
        app: streamshield-api
    spec:
      containers:
        - name: api
          image: streamshield/api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: streamshield-secrets
            - configMapRef:
                name: streamshield-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: streamshield-api
spec:
  selector:
    app: streamshield-api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: streamshield-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: streamshield-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
