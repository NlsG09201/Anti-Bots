version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: streamshield-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamshield_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-streamshield}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamshield"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streamshield

  redis:
    image: redis:7-alpine
    container_name: streamshield-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_password} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streamshield

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: streamshield-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-streamshield}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq_secure_password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - streamshield

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streamshield-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-streamshield}:${POSTGRES_PASSWORD:-streamshield_secure_password}@postgres:5432/${POSTGRES_DB:-streamshield}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-streamshield}:${RABBITMQ_PASSWORD:-rabbitmq_secure_password}@rabbitmq:5672//
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - streamshield

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streamshield-celery-worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-streamshield}:${POSTGRES_PASSWORD:-streamshield_secure_password}@postgres:5432/${POSTGRES_DB:-streamshield}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-streamshield}:${RABBITMQ_PASSWORD:-rabbitmq_secure_password}@rabbitmq:5672//
    depends_on:
      - api
      - postgres
      - redis
      - rabbitmq
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    networks:
      - streamshield

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streamshield-celery-beat
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-streamshield}:${POSTGRES_PASSWORD:-streamshield_secure_password}@postgres:5432/${POSTGRES_DB:-streamshield}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-streamshield}:${RABBITMQ_PASSWORD:-rabbitmq_secure_password}@rabbitmq:5672//
    depends_on:
      - celery-worker
    command: celery -A app.workers.celery_app beat --loglevel=info
    networks:
      - streamshield

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: streamshield-frontend
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - streamshield

  nginx:
    image: nginx:1.25-alpine
    container_name: streamshield-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
      - frontend
    networks:
      - streamshield

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: streamshield-prometheus
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - streamshield

  grafana:
    image: grafana/grafana:10.4.0
    container_name: streamshield-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - streamshield

  loki:
    image: grafana/loki:2.9.4
    container_name: streamshield-loki
    ports:
      - "3100:3100"
    volumes:
      - ./infrastructure/loki/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - streamshield

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: streamshield-otel
    volumes:
      - ./infrastructure/otel/otel-collector.yml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - streamshield

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  streamshield:
    driver: bridge
