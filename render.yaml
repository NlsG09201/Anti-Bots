services:
  - type: web
    name: anti-bots-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: AES_ENCRYPTION_KEY
        sync: false
      - key: APP_DEBUG
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: APP_CORS_ORIGINS
        value: https://anti-bots.vercel.app,https://anti-bots-vhbo.vercel.app
      - key: APP_FRONTEND_URL
        value: https://anti-bots.vercel.app
      - key: TWITCH_REDIRECT_URI
        value: https://anti-bots.onrender.com/api/v1/integrations/twitch/callback
      - key: TWITCH_EVENTSUB_CALLBACK_URL
        value: https://anti-bots.onrender.com/api/v1/webhooks/twitch
      - key: KICK_CLIENT_ID
        sync: false
      - key: KICK_CLIENT_SECRET
        sync: false
      - key: KICK_REDIRECT_URI
        value: https://anti-bots.onrender.com/api/v1/integrations/kick/callback
      - key: KICK_WEBHOOK_CALLBACK_URL
        value: https://anti-bots.onrender.com/api/v1/webhooks/kick
      - key: TRUSTED_HOSTS
        value: anti-bots.onrender.com,anti-bots-api.onrender.com
      - key: RENDER
        value: "true"
      - key: PLATFORM_MONITOR_RUN_IN_API
        value: "true"
      - key: EVENT_QUEUE_ENABLED
        value: "true"
      - key: EVENT_QUEUE_WORKER_IN_API
        value: "true"
      - key: EVENT_QUEUE_MAX_JOBS
        value: "2"
      - key: EVENT_STREAM_MAX_LEN
        value: "1000"
      - key: AI_ENABLED
        value: "false"
      - key: OPENAI_CHAT_ANALYSIS_ENABLED
        value: "false"
      - key: PLATFORM_MONITOR_ENABLED
        value: "true"
      - key: LIVE_INTEL_ENABLED
        value: "true"
      - key: TWITCHBOTS_INFO_ENABLED
        value: "true"
      - key: WEKA_J48_ENABLED
        value: "false"
      - key: WEKA_JVM_EAGER_START
        value: "false"
      - key: TWITCH_INSIGHTS_ENABLED
        value: "false"
      - key: REDIS_URL
        fromService:
          name: anti-bots-keyvalue
          type: keyvalue
          property: connectionString
    healthCheckPath: /health

  - type: keyvalue
    name: anti-bots-keyvalue
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    persistenceMode: off
    ipAllowList: []
