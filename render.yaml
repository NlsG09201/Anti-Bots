services:
  - type: web
    name: anti-bots-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip setuptools wheel && pip install --prefer-binary -r requirements.txt
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
