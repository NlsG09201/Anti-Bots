services:
  - type: web
    name: anti-bots-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: APP_CORS_ORIGINS
        value: https://anti-bots.vercel.app,https://anti-bots-vhbo.vercel.app
      - key: APP_FRONTEND_URL
        value: https://anti-bots.vercel.app
      - key: TWITCH_REDIRECT_URI
        value: https://anti-bots.onrender.com/api/v1/integrations/twitch/callback
      - key: TWITCH_EVENTSUB_CALLBACK_URL
        value: https://anti-bots.onrender.com/api/v1/webhooks/twitch
      - key: TRUSTED_HOSTS
        value: anti-bots.onrender.com,anti-bots-api.onrender.com,.onrender.com,localhost,127.0.0.1
      - key: RENDER
        value: "true"
      - key: PLATFORM_MONITOR_RUN_IN_API
        value: "false"
      - key: EVENT_QUEUE_ENABLED
        value: "true"
      - key: AI_ENABLED
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_MODERATION_MODEL
        value: omni-moderation-latest
      - key: OPENAI_INPUT_COST_PER_MILLION
        sync: false
      - key: OPENAI_OUTPUT_COST_PER_MILLION
        sync: false
      - key: OPENAI_CHAT_ANALYSIS_ENABLED
        value: "true"
      - key: OPENAI_TIMEOUT_SECONDS
        value: "12"
      - key: OPENAI_MAX_RETRIES
        value: "2"
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: "350"
      - key: OPENAI_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: OPENAI_ANALYSIS_CACHE_SECONDS
        value: "900"
      - key: PLATFORM_MONITOR_ENABLED
        value: "true"
      - key: LIVE_INTEL_ENABLED
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        value: https://cosmic-condor-242943.upstash.io
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
    healthCheckPath: /health

  - type: worker
    name: anti-bots-platform-monitor
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: production
      - key: RENDER
        value: "true"
      - key: PLATFORM_MONITOR_WORKER
        value: "true"
      - key: PLATFORM_MONITOR_RUN_IN_API
        value: "false"
      - key: PLATFORM_MONITOR_ENABLED
        value: "true"
      - key: EVENT_QUEUE_ENABLED
        value: "true"
      - key: AI_ENABLED
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_MODERATION_MODEL
        value: omni-moderation-latest
      - key: OPENAI_INPUT_COST_PER_MILLION
        sync: false
      - key: OPENAI_OUTPUT_COST_PER_MILLION
        sync: false
      - key: OPENAI_CHAT_ANALYSIS_ENABLED
        value: "true"
      - key: OPENAI_TIMEOUT_SECONDS
        value: "12"
      - key: OPENAI_MAX_RETRIES
        value: "2"
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: "350"
      - key: OPENAI_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: OPENAI_ANALYSIS_CACHE_SECONDS
        value: "900"
      - key: LIVE_INTEL_ENABLED
        value: "true"
      - key: WEKA_J48_ENABLED
        value: "false"
      - key: TWITCH_INSIGHTS_ENABLED
        value: "false"
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        value: https://cosmic-condor-242943.upstash.io
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Mismas secrets que anti-bots-api (DATABASE_URL, REDIS_URL, keys OAuth, etc.)

  - type: cron
    name: anti-bots-bi-refresh
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    schedule: "0 7 * * *"
    plan: starter
    startCommand: python scripts/refresh_warehouse.py
    envVars:
      - key: APP_ENV
        value: production
      - key: RENDER
        value: "true"
      - key: DATABASE_URL
        sync: false
