services:
  - type: web
    name: anti-bots-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip setuptools wheel && pip install --prefer-binary -r requirements.txt
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: APP_CORS_ORIGINS
        value: https://anti-bots.vercel.app,https://anti-bots-vhbo.vercel.app
      - key: APP_FRONTEND_URL
        value: https://anti-bots.vercel.app
      - key: TRUSTED_HOSTS
        value: anti-bots.onrender.com,anti-bots-api.onrender.com,.onrender.com,localhost,127.0.0.1
      - key: RENDER
        value: "true"
      # Secrets: Render Dashboard -> Environment -> import deploy/render.import.env
    # Preflight must run first so missing DATABASE_URL shows clearly in logs (not only uvicorn traceback).
    startCommand: python scripts/render_check_env.py && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
