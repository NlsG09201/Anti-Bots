# Entorno de desarrollo local aislado. No reutiliza secretos de Render/VPS.
# Uso desde la raíz: docker compose -f deploy/local/docker-compose.dev.yml up --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: streamshield
      POSTGRES_PASSWORD: local_only_change_me
      POSTGRES_DB: streamshield
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamshield -d streamshield"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      APP_ENV: development
      APP_DEBUG: "false"
      APP_SECRET_KEY: local-only-app-secret-key-change-before-any-shared-use
      APP_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_URL: postgresql+asyncpg://streamshield:local_only_change_me@postgres:5432/streamshield
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: local-only-jwt-secret-key-change-before-any-shared-use
      AES_ENCRYPTION_KEY: local-only-aes-encryption-key-32bytes
      PLATFORM_MONITOR_ENABLED: "false"
      LIVE_INTEL_ENABLED: "false"
      TWITCH_INSIGHTS_ENABLED: "false"
      WEKA_J48_ENABLED: "false"
      EVENT_PIPELINE_ENABLED: "true"
      EVENT_QUEUE_ENABLED: "true"
      EVENT_REALTIME_PUBSUB_ENABLED: "true"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-2G}

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      target: development
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      API_PROXY_TARGET: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_API_DIRECT_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../../frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  event-worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["arq", "app.workers.arq_worker.WorkerSettings"]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      APP_ENV: development
      APP_SECRET_KEY: local-only-app-secret-key-change-before-any-shared-use
      DATABASE_URL: postgresql+asyncpg://streamshield:local_only_change_me@postgres:5432/streamshield
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: local-only-jwt-secret-key-change-before-any-shared-use
      AES_ENCRYPTION_KEY: local-only-aes-encryption-key-32bytes
      PLATFORM_MONITOR_ENABLED: "false"
      LIVE_INTEL_ENABLED: "false"
      TWITCH_INSIGHTS_ENABLED: "false"
      WEKA_J48_ENABLED: "false"
      EVENT_PIPELINE_ENABLED: "true"
      EVENT_QUEUE_ENABLED: "true"
      EVENT_REALTIME_PUBSUB_ENABLED: "true"
      PLATFORM_MONITOR_WORKER: "true"
      PLATFORM_MONITOR_RUN_IN_API: "false"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  local_postgres_data:
  frontend_node_modules:
  frontend_next:
