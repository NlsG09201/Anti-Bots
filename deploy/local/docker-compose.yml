# API local con las mismas variables que Render (prueba rapida)
services:
  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file:
      - ../render.import.env
    ports:
      - "8000:8000"
    environment:
      RENDER: "false"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
