# StreamShield Enterprise — full local stack
# Usage:
#   cp deploy/enterprise/.env.example deploy/enterprise/.env
#   docker compose -f deploy/enterprise/docker-compose.enterprise.yml up --build
#   Prometheus is available at http://127.0.0.1:9090 (local machine only).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: streamshield
      POSTGRES_PASSWORD: streamshield_dev
      POSTGRES_DB: streamshield
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamshield"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://streamshield:streamshield_dev@postgres:5432/streamshield
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      EVENT_PIPELINE_ENABLED: "true"
      EVENT_QUEUE_ENABLED: "true"
      EVENT_REALTIME_PUBSUB_ENABLED: "true"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  event-worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: arq app.workers.arq_worker.WorkerSettings
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://streamshield:streamshield_dev@postgres:5432/streamshield
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      EVENT_PIPELINE_ENABLED: "true"
      EVENT_QUEUE_ENABLED: "true"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  celery-worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://streamshield:streamshield_dev@postgres:5432/streamshield
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://streamshield:streamshield_dev@postgres:5432/streamshield
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../../infrastructure/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      api:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    command:
      - --datasource.uri=postgres:5432/streamshield?sslmode=disable
    environment:
      DATA_SOURCE_USER: streamshield
      DATA_SOURCE_PASS: streamshield_dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis-exporter:
    image: ghcr.io/oliver006/redis_exporter:v1.93.0-alpine
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Frontend: run locally with `cd frontend && npm run dev` (no Dockerfile yet)

volumes:
  pgdata:
  redis_data:
  prometheus_data:
