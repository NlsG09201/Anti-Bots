# Stack simplificado para VPS / Oracle Cloud Free Tier
# Usa Redis como broker Celery (sin RabbitMQ)
version: "3.9"

services:
  api:
    build: ./backend
    env_file: .env
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"
      CELERY_BROKER_URL: ${REDIS_URL}
      CELERY_RESULT_BACKEND: ${REDIS_URL}
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: unless-stopped

  celery-worker:
    build: ./backend
    env_file: .env
    environment:
      CELERY_BROKER_URL: ${REDIS_URL}
      CELERY_RESULT_BACKEND: ${REDIS_URL}
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build: ./frontend
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:

# PostgreSQL: usar Neon externo (DATABASE_URL en .env)
# NGINX + Certbot: instalar en el host, no en compose
