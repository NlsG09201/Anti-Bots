name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  deployment-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test Render environment validation
        run: python -m unittest discover -s deploy/tests -v
      - name: Compile deployment scripts
        run: python -m compileall -q deploy

  spring-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-spring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend-spring/pom.xml
      - name: Verify Spring service
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Build Spring container image
        run: docker build --tag streamshield-spring-api:ci .

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Keep CI aligned with the Python 3.11 runtime used by backend/Dockerfile.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit --vulnerability-service osv -r requirements.txt -r requirements-dev.txt
      - name: Lint import graph
        run: python -c "from app.main import app; print(app.title)"
      - name: Compile Python sources
        run: python -m compileall -q app scripts tests
      - name: Tests
        run: pytest tests/ -q --tb=short -x
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: ""
          JWT_SECRET_KEY: ci-test-secret-min-32-chars-long
          AES_ENCRYPTION_KEY: ci-test-encryption-key-32b!!
      - name: Build API container image
        run: docker build --tag streamshield-backend-api:ci --file Dockerfile .
      - name: Build worker container image
        run: docker build --tag streamshield-backend-worker:ci --file Dockerfile.worker .
      - name: Validate Prometheus configuration and alert rules
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE/infrastructure/prometheus:/etc/prometheus:ro"
          prom/prometheus:v3.15.1
          promtool check config /etc/prometheus/prometheus.yml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Lint frontend
        run: npm run lint
      - name: Typecheck frontend
        run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
