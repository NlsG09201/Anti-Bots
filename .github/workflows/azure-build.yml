name: Build Azure containers

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/azure-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-container-build
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
        run: az acr login --name "$ACR_NAME"

      - name: Build and publish FastAPI image
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
        run: |
          set -euo pipefail
          image="$ACR_NAME.azurecr.io/streamshield-api:$GITHUB_SHA"
          docker build --pull --file backend/Dockerfile --tag "$image" backend
          docker push "$image"
          echo "API_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Build and publish Next.js image
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          API_URL: ${{ vars.AZURE_API_URL }}
        run: |
          set -euo pipefail
          test -n "$API_URL" || { echo "Missing AZURE_API_URL repository variable" >&2; exit 1; }
          ws_url="${API_URL/https:/wss:}"
          image="$ACR_NAME.azurecr.io/streamshield-web:$GITHUB_SHA"
          docker build --pull --file frontend/Dockerfile \
            --build-arg "API_PROXY_TARGET=$API_URL" \
            --build-arg "NEXT_PUBLIC_API_URL=$API_URL" \
            --build-arg "NEXT_PUBLIC_API_DIRECT_URL=$API_URL" \
            --build-arg "NEXT_PUBLIC_WS_URL=$ws_url" \
            --tag "$image" frontend
          docker push "$image"
          echo "WEB_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Record published image references
        run: |
          {
            echo "## Azure container images"
            echo "- API: `$API_IMAGE`"
            echo "- Web: `$WEB_IMAGE`"
          } >> "$GITHUB_STEP_SUMMARY"
